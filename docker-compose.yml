# Local infrastructure. The API itself runs on the host with `npm run start:dev`.
#
#   docker compose up -d                           Postgres + SeaweedFS (S3)
#   docker compose --profile observability up -d   ...plus Prometheus on :9090
#   docker compose --profile ollama up -d          ...plus Ollama in Docker (needs NVIDIA Container Toolkit)
#
# On Windows the native Ollama app is simpler than the Docker profile and uses the GPU directly.
# Ports are bound to 127.0.0.1 so nothing here is reachable from the network.

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: capsule
      POSTGRES_PASSWORD: capsule
      POSTGRES_DB: capsule
    ports: ['127.0.0.1:5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U capsule']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for photos. MinIO's images were withdrawn from public registries.
  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports: ['127.0.0.1:8333:8333']
    volumes:
      - 'seaweedfsdata:/data'
      - './infra/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO /dev/null http://127.0.0.1:8333/healthz']
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    profiles: [observability]
    image: prom/prometheus
    ports: ['127.0.0.1:9090:9090']
    volumes: ['./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro']
    extra_hosts: ['host.docker.internal:host-gateway']

  ollama:
    profiles: [ollama]
    image: ollama/ollama
    ports: ['127.0.0.1:11434:11434']
    volumes: ['ollamadata:/root/.ollama']
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  pgdata:
  seaweedfsdata:
  ollamadata:
