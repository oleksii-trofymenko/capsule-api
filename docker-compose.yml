# Local infrastructure. The API itself runs on the host with `npm run start:dev`.
#
#   docker compose up -d                           Postgres + MinIO
#   docker compose --profile observability up -d   ...plus Prometheus on :9090
#   docker compose --profile ollama up -d          ...plus Ollama in Docker (needs NVIDIA Container Toolkit)
#
# On Windows the native Ollama app is simpler than the Docker profile and uses the GPU directly.
# Ports are bound to 127.0.0.1 so nothing here is reachable from the network.

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: capsule
      POSTGRES_PASSWORD: capsule
      POSTGRES_DB: capsule
    ports: ['127.0.0.1:5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U capsule']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: capsule
      MINIO_ROOT_PASSWORD: capsule-dev-secret
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: ['miniodata:/data']

  prometheus:
    profiles: [observability]
    image: prom/prometheus
    ports: ['127.0.0.1:9090:9090']
    volumes: ['./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro']
    extra_hosts: ['host.docker.internal:host-gateway']

  ollama:
    profiles: [ollama]
    image: ollama/ollama
    ports: ['127.0.0.1:11434:11434']
    volumes: ['ollamadata:/root/.ollama']
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  pgdata:
  miniodata:
  ollamadata:
